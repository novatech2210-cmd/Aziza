name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend/services/api-gateway
        run: npm ci

      - name: TypeScript compilation
        working-directory: backend/services/api-gateway
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: backend/services/api-gateway
        run: npm test
        env:
          JWT_SECRET: test_ci_secret
          MONGODB_URI: mongodb://localhost:27017/aziza_ci

      - name: E2E tests
        working-directory: backend/services/api-gateway
        run: npm run test:e2e
        env:
          JWT_SECRET: test_ci_secret
          MONGODB_URI: mongodb://localhost:27017/aziza_ci

      - name: NestJS build
        working-directory: backend/services/api-gateway
        run: npx nest build
