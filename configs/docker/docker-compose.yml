version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./infrastructure/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - api-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf
    ports: ["6379:6379"]
    volumes: ["redis-data:/data", "./infrastructure/redis/redis.conf:/etc/redis/redis.conf"]

  mongodb:
    image: mongo:7
    volumes: ["mongo-data:/data/db", "./infrastructure/mongo/init.js:/docker-entrypoint-initdb.d/init.js"]

  api-gateway:
    build: ./services/api-gateway
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - ORCHESTRATOR_URL=http://orchestrator:8001

  personaplex:
    build: ./services/personaplex
    environment:
      - REDIS_URL=${REDIS_URL}
      - MONGO_URL=${MONGO_URL}
    # NO external ports. Internal network only.

  orchestrator:
    build: ./services/orchestrator
    environment:
      - REDIS_URL=${REDIS_URL}

#  moshi-worker:
#    build: ./services/moshi-worker
#    environment:
#      - MAX_SESSIONS=1
#      - WORKER_ID=${WORKER_ID:-worker-01}
#      - GPU_INDEX=${GPU_INDEX:-0}
#      - REDIS_URL=${REDIS_URL}
#      - ADAPTER_PATH=${ADAPTER_PATH:-""}  # Set after Phase 11 completes

  streaming-runtime:
    build: ./services/streaming-runtime
    environment:
      - REDIS_URL=${REDIS_URL}

  livekit:
    image: livekit/livekit-server:latest
    command:
      - --config
      - /etc/livekit/config.yaml
      - --keys
      - "devkey: devsecret"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./infrastructure/livekit/config.yaml:/etc/livekit/config.yaml
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
