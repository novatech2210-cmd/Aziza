;
; Phase 3 — ARI user for the AMD/LID adapter
; ==========================================
; Goes into /etc/asterisk/ari.conf  (append; do NOT replace the file)
;
; Used by services/adapter/ at slice 2 onwards to call:
;     POST /ari/channels/{id}/variable?variable=AMD_RESULT&value=MACHINE
;     POST /ari/channels/{id}/variable?variable=LID_RESULT&value=ru
;
; Slice 1 does not call ARI yet — but provisioning the user now means
; slice 2 is a one-line change.
;
; Make sure http.conf has:
;     [general]
;     enabled = yes
;     bindaddr = 127.0.0.1
;     bindport = 8088
; AND that no public listener is bound — keep ARI on localhost only.
;

[amd-stasis]
type = user
read_only = no
password = REPLACE_BEFORE_DEPLOY_OR_WILL_BE_REJECTED
password_format = plain
