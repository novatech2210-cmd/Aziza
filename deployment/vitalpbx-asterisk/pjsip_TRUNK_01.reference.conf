; ============================================================================
; pjsip_TRUNK_01.reference.conf  —  SOURCE-OF-TRUTH SNAPSHOT (not #included)
; ============================================================================
;
; Role
;   Captured, redaction-safe reference of the live VM-B `TRUNK_01` PJSIP
;   endpoint as it must look in production, INCLUDING the Phase A
;   audio-quality settings. Documentation/IaC reference only — NOT included
;   by Asterisk. VitalPBX owns the real files
;   (/etc/asterisk/vitalpbx/pjsip__*.conf, glob-included from pjsip.conf).
;
; DURABILITY — RESOLVED 2026-05-16 (was the open P3 risk)
;   The Phase A settings were originally hand-added directly to the
;   VitalPBX-generated trunks file (2026-05-13) and would revert on the
;   next UI "Apply Changes". They are now DURABLE via the sanctioned
;   VitalPBX mechanism: a dedicated **Device Profile** named
;   `CARRIER-TRUNK` (PJSIP), emitted by VitalPBX as Asterisk template
;   `[p13](!)`, attached to the trunk so it generates as `[TRUNK_01](p13)`
;   / `[TRUNK_01](p13-aor)`. Both the profile and the trunk->profile
;   binding are DB-backed, so every future regeneration re-emits them.
;
;   NOTE: VitalPBX 4.5.3's *trunk* editor has NO PJSIP-options field
;   (GENERAL has none; ADVANCED is SIP "Custom Headers" only — do NOT put
;   PJSIP params there, it would create bogus SIP headers). The Device
;   Profile is the correct and only sanctioned durable path. An earlier
;   draft of this file wrongly prescribed the trunk Advanced tab.
;
; HOW TO RE-CREATE THE DURABLE STATE (VitalPBX UI)
;   SETTINGS -> Technology Settings -> Device Profiles -> Add (PJSIP),
;   Name `CARRIER-TRUNK`. Clone the "Default PJSIP Profile" values, then:
;     GENERAL deltas:
;       Direct Media           = No     (Phase A; the one real change)
;       Force rport            = Yes    (Phase A; already default)
;       Rewrite Contact        = Yes    (Phase A; already default)
;       RTP Symmetric          = Yes    (Phase A; already default)
;       RTP Keepalive          = 15     (Phase A; already default)
;       Send Diversion Header  = Yes    (match validated baseline)
;       Send Connected Line    = Yes    (match validated baseline)
;       Send P-Asserted-Identity = No   (match baseline)
;       Send Remote-Party-ID   = No     (match baseline)
;     ADVANCED (Parameter/Value table):
;       tos_audio = ef
;       cos_audio = 5
;   Then PBX -> Trunks -> TRUNK_01 -> GENERAL -> Profile = CARRIER-TRUNK
;   -> Save -> Apply Changes.
;
; VERIFIED LIVE 2026-05-16 (asterisk -rx "pjsip show endpoint TRUNK_01"),
;   after a real Apply/regeneration cycle, sourced from profile [p13]:
;     direct_media=false  rtp_symmetric=true  force_rport=true
;     rewrite_contact=true  rtp_keepalive=15  cos_audio=5
;     tos_audio=184   (= DSCP EF 46, written into the 8-bit ToS byte as
;                       46<<2=184 — correct expansion of `tos_audio=ef`)
;   Carrier-facing signaling preserved (no regression): send_diversion=true,
;   send_connected_line=yes, send_pai=false, send_rpid=false,
;   trust_id_*=false, context=trk-1-in, allow=(alaw|ulaw).
;   Accepted benign profile-inherited deltas on this point-to-point G.711
;   trunk: max_audio/video_streams 1->5, media_use_received_transport->yes,
;   media_encryption_optimistic->yes, mwi_subscribe_replaces_unsolicited->yes,
;   sub_min_expiry 0->300, rtp_timeout 0->30, rtp_timeout_hold 0->300,
;   disable_direct_media_on_nat->true (moot, direct media off),
;   dtls_setup->actpass (no DTLS on plain RTP), tone_zone->us (cosmetic).
;
; Source-of-truth / re-capture
;   ssh sida-pbx  (VM-B core-server-telephony, 10.9.0.3)
;   sudo grep -nA22 '^\[TRUNK_01\]' /etc/asterisk/vitalpbx/pjsip__50-1-trunks.conf
;   sudo asterisk -rx 'pjsip show endpoint TRUNK_01'
;
; Last verified: 2026-05-16  (P3 durability closed)
; ----------------------------------------------------------------------------


; ---------------------------------------------------------------------------
; (A) WHAT VITALPBX GENERATES NOW (DB-backed, regeneration-safe).
;     pjsip__50-1-trunks.conf  — trunk bound to the CARRIER-TRUNK profile:
; ---------------------------------------------------------------------------
[TRUNK_01](p13)
type=endpoint
dtmf_mode=rfc4733
transport=transport-udp-3baa003c2d301de89c68
context=trk-1-in
allow=!all,alaw,ulaw
language=en
aors=TRUNK_01
identify_by=ip
trust_id_inbound=no
trust_id_outbound=no
inband_progress=no

[TRUNK_01](p13-aor)
type=aor
max_contacts=2
contact=sip:TRUNK_01@10.9.0.2:5060
qualify_frequency=60
qualify_timeout=3

[TRUNK_01]
type=identify
endpoint=TRUNK_01
match=10.9.0.2

; ---------------------------------------------------------------------------
; (B) PHASE A — now delivered by the CARRIER-TRUNK profile template.
;     pjsip__40-1-profiles.conf  — `;CARRIER-TRUNK` -> [p13](!) (excerpt;
;     full template also carries the cloned Default-profile values):
; ---------------------------------------------------------------------------
[p13](!)
direct_media=no          ; Phase A — keep RTP anchored on Asterisk
rtp_symmetric=yes        ; Phase A — latch RTP to observed source
force_rport=yes          ; Phase A — reply to source port (NAT)
rewrite_contact=yes      ; Phase A — trust observed source (NAT)
rtp_keepalive=15         ; Phase A — hold pinhole through silence
tos_audio=ef             ; Phase A — DSCP EF (46) audio priority (ADVANCED)
cos_audio=5              ; Phase A — 802.1p CoS 5 audio (ADVANCED)
send_diversion=yes       ; baseline-preserving (not Phase A)
send_connected_line=yes  ; baseline-preserving (not Phase A)
send_pai=no              ; baseline-preserving
send_rpid=no             ; baseline-preserving
; ... plus cloned Default-profile values (codecs/timers/expiration/etc.)
