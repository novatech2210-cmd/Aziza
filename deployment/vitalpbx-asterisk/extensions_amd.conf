;
; Phase 3 — AMD/LID test context
; ==============================
; Owner: services/adapter/  (Python AudioSocket listener at 127.0.0.1:9095)
;
; VitalPBX deployment: drop this file at
;     /etc/asterisk/vitalpbx/extensions__99-amd.conf
; (chown www-data:root, chmod 644 — match sibling files)
;
; Asterisk merges section content across all extensions__*.conf includes,
; so our [cos-all-custom] entries get appended to VitalPBX's auto-generated
; cos-all-custom context. That makes 7777/7778 reachable from any extension
; in cos-all (e.g. ext 1001 / MicroSIP).
;
; Convention: Phase 3 owns this file. Do not cross-edit with Stage-1
; trunk routes — those live in different VitalPBX include files.
;
; Slice 2 scope (current):
;   - Adapter sets ${AMD_RESULT} and ${LID_RESULT} via ARI before AudioSocket
;     returns
;   - Dialplan branches on ${AMD_RESULT} after AudioSocket exits
;       MACHINE -> Hangup(16)
;       HUMAN   -> Playback(custom/connected) -> Hangup
;       (empty / UNCERTAIN) -> treated as HUMAN
;
; Slice 4 (parallel greeting) is implemented ADAPTER-SIDE, not in this
; dialplan: the adapter streams the greeting back over the existing
; full-duplex AudioSocket from t=0 and stops on decision. NO dialplan
; change is required here — the greeting rides inside AudioSocket().
; It is OFF unless greeting.json (enabled) + an 8 kHz mono 16-bit
; <prompt_dir>/<lang>.wav exist on VM-B. Code-complete 2026-05-16.
;
; NOTE — repo<->live drift to reconcile on the next VM-B deploy:
;   live /etc/asterisk/vitalpbx/extensions__99-amd.conf is stale-labelled
;   "Phase 4" and carries the KEPT MixMonitor() line (P2 decision
;   2026-05-16). This repo copy is the source of truth EXCEPT it must
;   gain that MixMonitor() line when synced. See doc 10 §6.
;

; --- bridge: route 7777/7778 from VitalPBX's internal-extension context ---
[cos-all-custom]
exten => 7777,1,Goto(from-amd-test,7777,1)
exten => 7778,1,Goto(from-amd-test,7778,1)

[from-amd-test]

; --- 7777: live mic test (softphone) ---
;
; AudioSocket needs a proper RFC4122 UUID as first arg (NOT ${UNIQUEID}, which
; is Asterisk's "timestamp.seq" format). Asterisk 20's CHANNEL(rawreadformat)/
; (rawwriteformat) are gone — only the R/O audio{read,write,native}format
; remain — so we cannot force slin16 from the dialplan. The channel stays in
; whatever the SIP codec negotiated (PCMU/PCMA = 8 kHz). The adapter is
; configured to expect 8 kHz inbound and upsample to 16 kHz for Vosk.
;
; Result delivery to the dialplan: adapter writes /tmp/amd-${AS_UUID}.{amd,lid}
; before closing the AudioSocket. ARI's POST /channels/{id}/variable is
; Stasis-only in Asterisk 20 ({"message":"Channel not in Stasis application"}),
; and this is a plain dialplan app, so we use a file handoff instead.
;
exten => 7777,1,NoOp(Phase 3 AMD test - call ${UNIQUEID})
 same =>      n,Answer()
 same =>      n,Set(AS_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same =>      n,Set(AMD_RESULT=)
 same =>      n,Set(LID_RESULT=)
 same =>      n,Verbose(2,AudioSocket -> 127.0.0.1:9095 uuid=${AS_UUID})
 same =>      n,AudioSocket(${AS_UUID},127.0.0.1:9095)
 same =>      n,Set(AMD_RESULT=${SHELL(cat /tmp/amd-${AS_UUID}.amd 2>/dev/null | tr -d '\n')})
 same =>      n,Set(LID_RESULT=${SHELL(cat /tmp/amd-${AS_UUID}.lid 2>/dev/null | tr -d '\n')})
 same =>      n,System(rm -f /tmp/amd-${AS_UUID}.amd /tmp/amd-${AS_UUID}.lid)
 same =>      n,Verbose(2,after AudioSocket: AMD=${AMD_RESULT} LID=${LID_RESULT})
 same =>      n,GotoIf($["${AMD_RESULT}" = "MACHINE"]?machine,1:human,1)

; --- 7778: deterministic playback test (no softphone needed) ---
; Place a recorded voicemail greeting at /var/lib/asterisk/sounds/custom/
; named test-voicemail.wav (or .sln16). Calling 7778 from any extension
; pipes that file into the adapter so the result should always be MACHINE.
exten => 7778,1,NoOp(Phase 3 AMD test - playback fixture)
 same =>      n,Answer()
 same =>      n,Set(AS_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same =>      n,Set(AMD_RESULT=)
 same =>      n,Set(LID_RESULT=)
 same =>      n,AudioSocket(${AS_UUID},127.0.0.1:9095)
 same =>      n,Set(AMD_RESULT=${SHELL(cat /tmp/amd-${AS_UUID}.amd 2>/dev/null | tr -d '\n')})
 same =>      n,Set(LID_RESULT=${SHELL(cat /tmp/amd-${AS_UUID}.lid 2>/dev/null | tr -d '\n')})
 same =>      n,System(rm -f /tmp/amd-${AS_UUID}.amd /tmp/amd-${AS_UUID}.lid)
 same =>      n,Playback(custom/test-voicemail)
 same =>      n,GotoIf($["${AMD_RESULT}" = "MACHINE"]?machine,1:human,1)

; --- result branches ---
exten => machine,1,NoOp(AMD = MACHINE  -> hangup)
 same =>        n,Verbose(2,Phase 3 result MACHINE for ${UNIQUEID} (LID=${LID_RESULT}))
 same =>        n,Hangup(16)

exten => human,1,NoOp(AMD = ${AMD_RESULT}  -> human path)
 same =>      n,Verbose(2,Phase 3 result HUMAN/empty for ${UNIQUEID} (LID=${LID_RESULT}))
 ; Drop any short prompt at /var/lib/asterisk/sounds/custom/connected.{wav,sln16}.
 ; If the file is missing Asterisk just logs and continues to Hangup.
 same =>      n,Playback(custom/connected)
 same =>      n,Hangup()
