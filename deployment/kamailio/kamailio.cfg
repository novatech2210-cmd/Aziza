#!KAMAILIO

# kamailio.cfg — Sida/AI telephony, VM-A (kamailio-edge)
#
# Role
#   SIP edge proxy. Signalling-only relay between the live carrier (today
#   TRUNK_01 = Nano Telecom (UZ), CIDR 146.120.19.0/24) and VitalPBX /
#   Asterisk on VM-B (private 10.9.0.3). No audio is processed here; RTP
#   flows directly between the carrier and VM-B.
#
# Listeners
#   178.104.152.17:5060  UDP+TCP   public  (carrier-facing, legacy)
#   10.9.0.2:5060        UDP+TCP   private (VM-B Asterisk, internal LAN)
#   100.94.66.56:5060    UDP       tailnet (office gateway via Tailscale)
#   127.0.0.1:5060       UDP       local   (kamcmd / sipsak from VM-A)
#
# Why a 100.94.66.56 listener (the Tailscale tailnet address):
#   The office 5G ISP runs deep-packet inspection that drops anything
#   matching SIP signatures (verified 2026-05-08), AND multi-layer
#   consumer NAT at the office breaks persistent UDP flows from a fixed
#   source port (~90-100% loss on direct WireGuard). Tailscale solves
#   both problems: NAT-traversal handles the latter, end-to-end
#   encryption hides the SIP signature from DPI. Tailnet IPs are stable;
#   tailscale daemon brings the tunnel up at boot via systemd.
#   Inside the tunnel the gateway (100.126.178.27) and VM-A
#   (100.94.66.56) appear to each other on a flat /10 CGNAT subnet,
#   and SIP uses standard UDP/5060.
#
# Source allowlist (request_route below)
#   accept:  146.120.19.0/24   carrier (TRUNK_01 = Nano Telecom)
#            183.182.105.91    admin / operator workstation
#            10.9.0.0/24       private LAN (Asterisk + helpers)
#            100.64.0.0/10     Tailscale tailnet (gateway is 100.126.178.27)
#            127.0.0.0/8       loopback
#   reject:  everything else with 403 Forbidden + xlog L_NOTICE
#
# Pattern A — outbound routing via gateway-REGISTER pinhole
#   The office gateway REGISTERs here every 30s through the Tailscale
#   tunnel. We capture the tailnet-side source IP+port
#   (100.126.178.27:<port>) in $sht(gw=>addr) and use it as the
#   destination for outbound INVITEs from VM-B. Tailscale handles all
#   NAT-traversal/keepalive at the transport layer; SIP is plain inside.
#   Trade-off: if the gateway hasn't REGISTERed within autoexpire (5 min)
#   we 502 outbound calls explicitly rather than blackholing them.
#
# Source-of-truth
#   deploy/kamailio/kamailio.cfg in the project repo. Push with
#   deploy/kamailio/push.ps1 — validates with `kamailio -c`, atomic apply,
#   `systemctl reload kamailio`, tails the journal.
#
# Reference
#   Docs/claude_review/Setup_Guide_1_Kamailio.md     §6 base config
#                                                    §8.3 allowlist
#                                                    §11 anti-abuse
#   Docs/phase2/07_FORM_Stage_1_Carrier_Input_Sheet.md  §E carrier CIDR
#   Docs/phase2/08_REFERENCE_Call_Flow_Architecture.md  §3.2 diagram
#
# Last edited: 2026-05-08
###############################################################################


####### Global Parameters ###################################################

debug=2
log_stderror=no
log_facility=LOG_LOCAL0
log_name="kamailio"

fork=yes
children=4
auto_aliases=no

listen=udp:178.104.152.17:5060
listen=tcp:178.104.152.17:5060
listen=udp:10.9.0.2:5060
listen=tcp:10.9.0.2:5060
listen=udp:100.94.66.56:5060   # Tailscale tailnet to office gateway
listen=udp:127.0.0.1:5060

alias="kamailio-edge"
alias="178.104.152.17"
alias="10.9.0.2"
alias="100.94.66.56"

tcp_connection_lifetime=3604
tcp_max_connections=2048


####### Modules #############################################################

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"

# Pattern A — outbound routing state.
# We use htable as a single-slot store for the gateway's last-seen
# Source IP+port (captured at REGISTER time, used at outbound INVITE time).
# autoexpire=300 means: if the gateway stops registering for 5 min, the
# entry vanishes and outbound calls fail-fast with 502 Gateway Not
# Registered (instead of relaying to a dead address).
loadmodule "htable.so"

# Anti-abuse — enable after first live test passes (see Setup_Guide_1 §11).
# loadmodule "pike.so"


####### Module parameters ###################################################

# tm — 30s for non-INVITE final response; 120s for INVITE.
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# htable "gw" — single-row table holding the gateway's last-seen
# source-address. autoexpire=300s = fail-fast after 5 min of no REGISTER.
modparam("htable", "htable", "gw=>size=4;autoexpire=300")


####### Routing #############################################################

request_route {

    # 1. Hop count
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # 2. SIP sanity — drop malformed packets early
    if (!sanity_check()) {
        xlog("L_INFO", "[kamedge] sanity failed: $rm from $si:$sp\n");
        exit;
    }

    # 3. Source allowlist
    # Today: TRUNK_01 = Nano Telecom (UZ) — 146.120.19.0/24 (Nano's
    # RIPE-announced /24, per WHOIS 2026-05-07).
    # Office gateway (QUBEAI-01, Lenovo Win11 Pro) reaches us via
    # Tailscale tunnel — sees source 100.126.178.27 (the gateway's
    # tailnet IP) inside the tunnel. The 100.64.0.0/10 range covers all
    # Tailscale CGNAT space, so future tailnet peers (e.g. an admin
    # laptop, future TRUNK_02 gateway) are pre-allowed.
    if (
        !(src_ip == 146.120.19.0/24)
        && !(src_ip == 183.182.105.91)
        && !(src_ip == 10.9.0.0/24)
        && !(src_ip == 100.64.0.0/10)
        && !(src_ip == 127.0.0.0/8)
    ) {
        xlog("L_NOTICE", "[kamedge] reject $rm from $si:$sp\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # 4. In-dialog requests (BYE, ACK, re-INVITE, CANCEL of established call)
    #    — follow the path recorded at INVITE time.
    if (has_totag()) {
        if (loose_route()) {
            if (!t_relay()) { sl_reply_error(); }
        } else {
            sl_send_reply("404", "Not here");
        }
        exit;
    }

    # 5. OPTIONS keepalive — answer here, don't pester Asterisk.
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # 6. REGISTER from the office gateway (over Tailscale tunnel).
    # The gateway uses these REGISTERs to record its tailnet-side source
    # address. We don't run a real registrar (no usrloc DB) -- just
    # capture src addr+port in htable and 200 OK the request. That's
    # sufficient for Pattern A outbound routing below.
    if (is_method("REGISTER")) {
        if (src_ip == 100.126.178.27) {
            $sht(gw=>addr) = $si + ":" + $sp;
            xlog("L_INFO", "[kamedge] gateway REGISTER from $si:$sp -> stored\n");
            sl_send_reply("200", "OK");
            exit;
        }
        xlog("L_NOTICE", "[kamedge] reject REGISTER from $si:$sp (not gateway)\n");
        sl_send_reply("403", "Forbidden REGISTER");
        exit;
    }

    # 7. Initial INVITE / MESSAGE
    if (is_method("INVITE|MESSAGE")) {
        record_route();

        if (src_ip == 146.120.19.0/24) {
            # Legacy direct path: carrier -> Kamailio -> VM-B.
            # Kept as a fallback if Nano ever sends straight to VM-A's
            # public IP. In Pattern A the carrier reaches us via the
            # gateway, so this branch should rarely fire.
            $du = "sip:10.9.0.3:5060";

        } else if (src_ip == 100.126.178.27) {
            # Inbound from gateway (over Tailscale) -> forward to VM-B.
            #
            # force_send_socket is REQUIRED here for the mirror reason the
            # outbound branch below explains: by default Kamailio relays
            # out the same socket the INVITE arrived on (100.94.66.56),
            # so VM-B sees the packet from a tailnet source. But VM-B's
            # PJSIP identify for TRUNK_01 matches 10.9.0.2/32 only, so a
            # tailnet-sourced INVITE doesn't identify and is silently
            # dropped (no Asterisk log entry; PJSIP discards pre-dialplan).
            # Force the private-LAN socket so VM-B sees source 10.9.0.2
            # and identify matches. Discovered 2026-05-13 by side-by-side
            # bind-source probe: 10.9.0.2 -> 10.9.0.3 got 200 OK,
            # 100.94.66.56 -> 10.9.0.3 got nothing.
            force_send_socket(udp:10.9.0.2:5060);
            $du = "sip:10.9.0.3:5060";

        } else if (src_ip == 10.9.0.3) {
            # Outbound from VM-B (VitalPBX/Asterisk).
            # Look up the gateway's stored tailnet-side source-address
            # and route there.
            #
            # force_send_socket is REQUIRED here even though kernel
            # routing for 100.64.0.0/10 goes via tailscale0: by default
            # Kamailio sends out the FIRST listener (178.104.152.17:5060,
            # the public one) regardless of $du destination. Without the
            # explicit force_send_socket, the INVITE leaves on eth0 with
            # source 178.104.152.17 instead of 100.94.66.56, which
            # (a) doesn't actually reach the gateway because 100.x is
            # CGNAT-only, and (b) even if reflected somehow wouldn't
            # match the gateway's identify rule (match=100.94.66.56).
            # Discovered 2026-05-09 by side-by-side tcpdump on tailscale0
            # showing zero INVITE packets while Kamailio claimed to relay.
            if ($sht(gw=>addr) == $null) {
                xlog("L_NOTICE",
                    "[kamedge] outbound: gateway not registered, dropping $rm $ru\n");
                sl_send_reply("502", "Gateway Not Registered");
                exit;
            }
            force_send_socket(udp:100.94.66.56:5060);
            $du = "sip:" + $sht(gw=>addr);
            xlog("L_INFO",
                "[kamedge] outbound: $rU -> $sht(gw=>addr)\n");
        }

        if (!t_relay()) { sl_reply_error(); }
        exit;
    }

    # 8. Anything else
    sl_send_reply("405", "Method Not Allowed");
}
