; pjsip.conf — Sida/AI telephony, office TAS-IX gateway
;
; Role
;   The carrier-facing edge for TRUNK_01. Asterisk on a Hyper-V Debian VM
;   running on Ivan's office laptop (QUBEAI-01) inside the TAS-IX zone.
;   - REGISTERs to Nano Telecom (146.120.19.68) so Nano accepts our calls.
;   - REGISTERs to Kamailio on VM-A (178.104.152.17) so Kamailio knows the
;     gateway's NAT-translated source IP+port and can route outbound calls
;     back through the existing pinhole. (Pattern A — see Setup_Guide_1
;     §11 / closure guide §8.4.)
;   - Forwards inbound calls Nano → Kamailio (via the trunk_vma endpoint).
;   - Receives outbound calls from Kamailio (via the trunk_vma endpoint)
;     and dials them out via trunk_nano.
;
; Source-of-truth
;   deploy/asterisk-gateway/pjsip.conf in the project repo. Push with
;   deploy/asterisk-gateway/push.ps1 — atomic copy, pjsip reload, journal
;   tail. Per-file backups under /etc/asterisk/<file>.bak.<UTC-timestamp>.
;
; Secrets
;   The trunk_nano_auth block lives in pjsip.secrets.conf (gitignored);
;   it is #include'd at the bottom of this file. Copy
;   pjsip.secrets.conf.example -> pjsip.secrets.conf locally, fill in the
;   real password, and the push will SCP both files together.
;
; Reference
;   Docs/pilot/04_GUIDE_Office_Gateway_Setup.md   — how the gateway was built
;   Docs/pilot/05_OPERATIONAL_RUNBOOK.md          — day-to-day verification
;   Docs/phase2/07_FORM_Stage_1_Carrier_Input_Sheet.md §G  — carrier facts
;
; Last edited: 2026-05-08

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Gateway <-> Kamailio path runs over a Tailscale tunnel
; (gateway 100.126.178.27 <-> Kamailio 100.94.66.56). Plain SIP-over-
; UDP/5060 inside the tunnel works fine -- the office's SIP DPI only
; sees encrypted Tailscale traffic on the public path, and Tailscale's
; NAT-traversal handles the multi-layer consumer NAT problem at the
; office that defeated direct WireGuard. See Docs/phase2/12_REFERENCE_
; Session_Log_2026-05-08.md for the discovery sequence.

;-----------------------------------------------------------------------------
; trunk_nano — REGISTER + carrier-facing endpoint to Nano Telecom (UZ).
; Auth block (trunk_nano_auth) is in pjsip.secrets.conf.
;-----------------------------------------------------------------------------

[trunk_nano]
type = endpoint
context = from-nano
disallow = all
allow = alaw,ulaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; RTP NAT-binding keepalive (15s) — keeps the carrier-side pinhole open
; through long silences. Tailscale isn't between us and Nano (this leg
; is direct UDP via TAS-IX), but the carrier-side SBC has its own
; UDP-conntrack timeout that 15s is well under.
rtp_keepalive = 15
; QoS — mark RTP as DSCP EF (46) so any congested hop prioritises voice.
; Carriers commonly honour DSCP on their backbone; harmless if not.
tos_audio = ef
cos_audio = 5
outbound_auth = trunk_nano_auth
aors = trunk_nano_aor
from_user = 712051245
from_domain = 146.120.19.68

[trunk_nano_aor]
type = aor
contact = sip:146.120.19.68:5060

[trunk_nano_reg]
type = registration
outbound_auth = trunk_nano_auth
server_uri = sip:146.120.19.68:5060
client_uri = sip:712051245@146.120.19.68
contact_user = 712051245
expiration = 60
retry_interval = 60
forbidden_retry_interval = 600

[trunk_nano_identify]
type = identify
endpoint = trunk_nano
match = 146.120.19.0/24

;-----------------------------------------------------------------------------
; trunk_vma — Kamailio-facing endpoint. Inbound INVITEs from Kamailio
; (relayed from VM-B for outbound calls) land here on context from-vma.
; No auth — Kamailio is identified by source IP (100.94.66.56, its
; tailnet address) and gated by our own UFW + Tailscale ACL.
;-----------------------------------------------------------------------------

[trunk_vma]
type = endpoint
context = from-vma
disallow = all
allow = alaw,ulaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; RTP keepalive (15s) — most important on THIS leg because the gateway-
; to-Kamailio path runs over Tailscale, and userspace tunnels can be
; rougher on long-silence UDP flows than direct routes. Cheap insurance.
rtp_keepalive = 15
; QoS — DSCP EF on RTP egress. Tailscale honours DSCP markings end-to-
; end on Linux, so under contention with bulk TCP through the same
; tailnet node, voice frames get priority dequeue.
tos_audio = ef
cos_audio = 5
aors = trunk_vma_aor

[trunk_vma_aor]
type = aor
contact = sip:100.94.66.56:5060

[trunk_vma_identify]
type = identify
endpoint = trunk_vma
match = 100.94.66.56

;-----------------------------------------------------------------------------
; trunk_kam_reg — REGISTER to Kamailio every 30s over the Tailscale tunnel.
; This is the load-bearing piece for Pattern A outbound routing: each
; REGISTER tells Kamailio the gateway's tailnet source addr+port, which
; it stores in htable and uses as the destination for outbound INVITEs
; from VM-B. Tailscale handles NAT/keepalive at the transport layer; the
; SIP REGISTER cadence is just for Kamailio's bookkeeping.
; No auth — Kamailio gates REGISTER by tailnet-IP allowlist (100.126.178.27).
;-----------------------------------------------------------------------------

[trunk_kam_reg]
type = registration
server_uri = sip:100.94.66.56:5060
client_uri = sip:gateway@100.94.66.56
contact_user = gateway
expiration = 30
retry_interval = 30
forbidden_retry_interval = 600

;-----------------------------------------------------------------------------
; Secrets — gitignored file with trunk_nano_auth credentials.
;-----------------------------------------------------------------------------

#include "pjsip.secrets.conf"
