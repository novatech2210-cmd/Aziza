; extensions.conf — Sida/AI telephony, office TAS-IX gateway
;
; Role
;   Cross-trunk forwarder. The gateway has no users, queues, IVRs, or
;   features — it is purely a relay between trunk_nano (carrier) and
;   trunk_vma (Kamailio).
;
;   Inbound  (Nano → Kamailio):  context [from-nano]
;   Outbound (Kamailio → Nano):  context [from-vma]
;
; Source-of-truth
;   deploy/asterisk-gateway/extensions.conf in the project repo.
;   Push with deploy/asterisk-gateway/push.ps1 (issues `dialplan reload`).
;
; Last edited: 2026-05-08

[from-nano]
exten => _X.,1,NoOp(Inbound from Nano: ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk_vma,60)
 same => n,Hangup()

[from-vma]
exten => _X.,1,NoOp(Outbound from VM-A: ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk_nano,60)
 same => n,Hangup()
