name: Aziza Milestone 2 Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml websockets asyncio psutil GPUtil
        
    - name: Run benchmark suite
      run: |
        cd benchmarks
        chmod +x scripts/run_benchmarks.sh
        ./scripts/run_benchmarks.sh
        
    - name: Upload benchmark reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-reports
        path: benchmarks/reports/
        retention-days: 30
        
    - name: Upload telemetry logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-telemetry
        path: benchmarks/telemetry/
        retention-days: 30
        
    - name: Check benchmark results
      run: |
        cd benchmarks
        python3 << 'EOF'
import json
import sys

with open('reports/final_report.json', 'r') as f:
    report = json.load(f)

if report['overall_status'] != 'PASS':
    print("Benchmarks FAILED")
    print(f"Failed benchmarks: {report['failed_benchmarks']}")
    sys.exit(1)
else:
    print("All benchmarks PASSED")
    sys.exit(0)
EOF
        
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('benchmarks/reports/final_report.json', 'utf8'));
          
          const comment = `## Benchmark Results
          
          **Overall Status:** ${report.overall_status}
          **Timestamp:** ${report.timestamp}
          
          ### Summary
          - Total Benchmarks: ${report.summary.total_benchmarks}
          - Passed: ${report.summary.passed_benchmarks}
          - Failed: ${report.summary.failed_benchmarks}
          - Missing: ${report.summary.missing_benchmarks}
          
          ${report.failed_benchmarks.length > 0 ? '### Failed Benchmarks\n' + report.failed_benchmarks.map(b => `- ${b}`).join('\n') : ''}
          
          See artifacts for detailed reports.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
